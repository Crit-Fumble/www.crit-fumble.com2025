name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Env-free gate: type-check + the static export. The build is the check that
  # nothing needs a server: a dynamic route handler or page fails
  # `output: 'export'`. The deploy builds the same way, from a reviewed ref.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run type-check
      - run: npm run build
      # NOTE: `npm run lint` (next lint) is intentionally NOT run — `next lint`
      # was removed in Next 16 (this repo is on 16.x) and errors immediately,
      # and there's no standalone eslint config yet. Re-add a lint step once the
      # project migrates to eslint directly.
